[workspace]
resolver = "2"
members = [
  "crates/ay-cf-assets",
  "crates/ay-cf-edge",
]
exclude = [
  "runtime",
  "sdk",
  "agents",
  "rust",
  "python",
  "net",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/ay-cf"

[workspace.dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
etagere = "0.3.0"
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
http = "1.5.0"
http-range-header = "1.1.0"
ktx2 = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spdx = "0.13.6"
thiserror = "2.0.21"
thumbhash = "0.1.0"
toml = "1.2.1"
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "deny"
expect_used = "deny"

# Uncomment locally after `just submodules-init rust` to build against local aphrody-labs Cloudflare forks:
# [patch.crates-io]
# pingora = { path = "rust/pingora/pingora" }
# quiche = { path = "rust/quiche/quiche" }
# worker = { path = "rust/workers-rs/worker" }
# foundations = { path = "rust/foundations/foundations" }
# boring = { path = "rust/boring/boring" }
