name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bun-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "canary"
      - run: bun install --frozen-lockfile
      - run: bun tools/private-gate.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aphrody-labs/ay-vercel
          path: .ay-vercel
          sparse-checkout: tools
          persist-credentials: false
      - run: echo "AY_VERCEL=$GITHUB_WORKSPACE/.ay-vercel" >> "$GITHUB_ENV"
      - run: bun "$AY_VERCEL/tools/forks.ts" --check
      - run: bun "$AY_VERCEL/tools/submodules.ts" --check
      - run: bun run check
      - run: bun run audit
      - run: bun x wrangler deploy --dry-run --outdir target/wrangler-dry --config workers/ay-cf-gateway/wrangler.jsonc
      - run: bun x wrangler deploy --dry-run --outdir target/wrangler-dry-release --config workers/ay-tools-release/wrangler.jsonc

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check python
      - run: uv run ruff format --check python
      - run: uv run pytest

  cpp-bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-
      - name: Install Bazelisk & run Abseil/GoogleTest suite
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          CC=clang CXX=clang++ bazelisk test --config=linux //cpp/...

  gate:
    if: always()
    needs: [bun-and-audit, python, cpp-bazel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.bun-and-audit.result }}" = success
          test "${{ needs.python.result }}" = success
          test "${{ needs.cpp-bazel.result }}" = success
