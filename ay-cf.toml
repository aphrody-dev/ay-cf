workers_dev = false
previews = false
secrets = []

[workers.api-aphrody-com]
profile = "api-gateway"
cpu_ms = 250
log_sampling = 0.25
trace_sampling = 0.1
workers_dev = false
previews = false
secrets = []

[workers.ay-tools-release]
profile = "cdn-router"
cpu_ms = 50
log_sampling = 0.1
trace_sampling = 0.05
workers_dev = true
previews = false
secrets = []

[workers.bun-video-showcase]
profile = "cdn-router"
cpu_ms = 50
log_sampling = 0.1
trace_sampling = 0.05
workers_dev = false
