[cluster]
mesh_cidr = "10.200.77.0/24"
cloudflared_quic_port = 7844

[cluster.build]
provider = "ovh"
os = "ubuntu-26.10"
mesh_ip = "10.200.77.1"
services = ["nativelink-server", "nativelink-worker", "sccache", "docker"]

[cluster.edge_proxy]
provider = "ovh"
os = "ubuntu-26.10"
mesh_ip = "10.200.77.3"
services = ["pingora", "nginx", "garage-s3", "valkey", "nativelink-worker"]

[cluster.origin]
provider = "hostinger"
os = "arch-linux"
mesh_ip = "10.200.77.5"
services = ["cloudflared-mig-prd", "cloudflared-rosegriffon", "docker", "nginx"]

[vpn]
provider = "mullvad"
mode = "uid-policy-routing"
preserve_mesh_cidr = "10.200.77.0/24"

[[vpn.exit]]
id = "us"
purpose = "google-api"
country = "us"
city = "qas"
uid = 2001
table = 51821

[[vpn.exit]]
id = "jp"
purpose = "crawler"
country = "jp"
city = "tyo"
uid = 2002
table = 51822

[[vpn.exit]]
id = "eu"
purpose = "eu-proxy-checks"
country = "fr"
city = "par"
uid = 2003
table = 51823
